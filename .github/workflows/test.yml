name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every job here runs against a throwaway HOME rather than --destination. That is
# not cosmetic: the install scripts address the machine through $HOME, so a job
# that only moves --destination can never execute them, and assertions built on
# `.chezmoi.homeDir` compare against the runner's real home instead of the tree
# under test. Overriding HOME moves homeDir, destDir and the scripts together.

jobs:
  lint:
    name: gates
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install chezmoi and shellcheck
        run: brew install chezmoi shellcheck

      - name: Mechanical guardrails
        run: ./scripts/check.sh

      # check.sh skips *.sh.tmpl because a chezmoi template is not valid shell
      # until rendered, and says so in its own output.
      - name: Rendered templates shellcheck clean, both profiles
        run: ./scripts/check-templates.sh

      # A gate that passes on a clean tree proves nothing by itself: one with every
      # check accidentally disabled passes identically. This plants each violation
      # in turn, including two broken templates, and asserts the right gate fails
      # with the right message.
      - name: Gates reject what they claim to reject
        run: ./scripts/check-negative.sh

  apply:
    name: apply (${{ matrix.profile }})
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [managed, owned]
    steps:
      - uses: actions/checkout@v7

      - name: Install chezmoi
        run: brew install chezmoi

      # settings.json has three authors. Seeding the destination with what the
      # other two write is the only way to exercise the merge: on an empty HOME the
      # modify_ script has nothing to preserve and the interesting half of it never
      # runs. The model key collides on purpose.
      - name: Seed a settings.json written by the other two authors
        run: |
          set -euo pipefail
          fake="$(mktemp -d)"
          mkdir -p "$fake/.claude"
          cat >"$fake/.claude/settings.json" <<'JSON'
          {
            "model": "sonnet",
            "autoMode": {
              "allow": ["Bash(echo:*)"],
              "environment": ["**Organization**: Example"]
            },
            "hooks": {
              "SessionStart": [
                { "hooks": [{ "type": "command", "command": "echo from-a-tool" }] }
              ]
            },
            "someOtherTool": { "keepMe": true }
          }
          JSON
          # Same reasoning for the git-identity registry: on an empty HOME the
          # merge has nothing to preserve, so the half that matters - leaving
          # another machine's ad hoc profile alone - never executes. The `private`
          # entry is seeded stale on purpose; ours has to win it.
          mkdir -p "$fake/.config/git-identity"
          cat >"$fake/.config/git-identity/profiles.json" <<'JSON'
          {
            "version": 1,
            "profiles": {
              "client-acme": {
                "ghConfigDir": "/tmp/gh-client-acme",
                "gitConfig": "/tmp/client-acme.gitconfig",
                "login": "someone-else"
              },
              "private": { "ghConfigDir": "/stale", "gitConfig": "/stale", "login": "stale" }
            }
          }
          JSON

          echo "FAKE_HOME=$fake" >>"$GITHUB_ENV"

      # --promptChoice is keyed on the prompt TEXT, not on the field it fills.
      # "Machine profile" must stay identical to the string in .chezmoi.toml.tmpl,
      # or the prompt fires, finds no TTY and answers itself with its own text.
      #
      # `apply` passes no --source: the config init just wrote records sourceDir,
      # and a bare apply finding the source tree is what README's bootstrap needs.
      - name: Apply into the throwaway HOME
        run: |
          set -euo pipefail
          env HOME="$FAKE_HOME" chezmoi init --source . \
            --promptChoice "Machine profile=${{ matrix.profile }}" --no-tty
          env HOME="$FAKE_HOME" chezmoi apply --exclude=scripts --no-tty

      - name: Assert init took the answer and recorded the source
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          cfg="$FAKE_HOME/.config/chezmoi/chezmoi.toml"

          grep -q 'profile = "${{ matrix.profile }}"' "$cfg" \
            || fail "--promptChoice did not answer the profile prompt: $(grep profile "$cfg")"
          grep -q '^sourceDir = ' "$cfg" \
            || fail "init did not record sourceDir; a bare 'chezmoi apply' would apply nothing"

      # -e, not -L: -L only says the path is a symlink, so a link pointing at
      # nothing passes it.
      - name: Assert the destination looks right
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          for link in .config/nvim .config/wezterm .config/herdr/config.toml \
                      .config/ccstatusline/settings.json; do
            [ -L "$FAKE_HOME/$link" ] || fail "$link is not a symlink"
            [ -e "$FAKE_HOME/$link" ] || fail "$link is a symlink to nothing"
          done
          for f in .zshrc .zprofile .gitconfig .claude/CLAUDE.md \
                   .claude/settings.json .agents/.skill-lock.json \
                   .config/git-identity/profiles.json \
                   .config/git-identity/private.gitconfig; do
            [ -f "$FAKE_HOME/$f" ] || fail "$f missing"
          done

          # gh owns every GH_CONFIG_DIR. chezmoi creating one would mean a token
          # store, or a file claiming a session that has none, arrived from git.
          [ -z "$(find "$FAKE_HOME/.config" -maxdepth 1 -name 'gh' -o -maxdepth 1 -name 'gh-*')" ] \
            || fail "chezmoi wrote a gh config directory; gh auth login owns those"

          jq -e '.extraKnownMarketplaces.bdk.source.path == $p' \
            --arg p "$FAKE_HOME/projects/bdk" \
            "$FAKE_HOME/.claude/settings.json" >/dev/null \
            || fail "bdk marketplace path was not merged in"
          [ ! -e "$FAKE_HOME/.claude/hooks" ] || fail "chezmoi wrote a hook file; tools own those"

          # The .claude directory holds gigabytes of runtime state. Only authored
          # files may appear. Symlinks are not counted by -type f.
          count="$(find "$FAKE_HOME/.claude" -type f | wc -l | tr -d ' ')"
          [ "$count" -eq 2 ] || fail "expected 2 authored files under .claude, found $count"

      - name: Assert the merge kept the other authors
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          s="$FAKE_HOME/.claude/settings.json"

          jq -e '.hooks.SessionStart[0].hooks[0].command == "echo from-a-tool"' "$s" >/dev/null \
            || fail "the hooks block was not preserved; the tools own it"
          jq -e '.autoMode.allow[0] == "Bash(echo:*)"' "$s" >/dev/null \
            || fail "autoMode was not preserved; Claude Code owns it"
          jq -e '.someOtherTool.keepMe == true' "$s" >/dev/null \
            || fail "an unrelated top-level key was dropped"
          jq -e '.model == "opus"' "$s" >/dev/null \
            || fail "our own value did not win the collision on .model"
          jq -e '.statusLine.command == "bunx -y ccstatusline@latest"' "$s" >/dev/null \
            || fail "our own keys were not merged in"

          # Both halves of the status line have to arrive: settings.json declares
          # the command, and the command renders whatever is in ccstatusline's own
          # config. Versioning one without the other gave a fresh machine the
          # default three-line layout and no way to tell why.
          jq -e '.lines | length == 3' \
            "$FAKE_HOME/.config/ccstatusline/settings.json" >/dev/null \
            || fail "the ccstatusline config did not arrive through its symlink"

          # Every marketplace an enabled plugin comes from must be declared, or the
          # plugin installs only on a machine that already has the marketplace
          # registered in its runtime state.
          jq -e '[.enabledPlugins | to_entries[] | select(.value) | .key
                  | split("@")[1]] - (.extraKnownMarketplaces | keys)
                 - ["claude-plugins-official"] | length == 0' "$s" >/dev/null \
            || fail "an enabled plugin comes from an undeclared marketplace"

          jq -e '.enabledPlugins["git-identity@bdk"] == true' "$s" >/dev/null \
            || fail "the git-identity plugin was not declared"

          # The registry is the second merged file, and the failure it guards
          # against is silent: a lost profile leaves its gh directory and its
          # gitconfig behind, so nothing looks broken until /git-identity:use
          # denies a profile that is plainly there.
          r="$FAKE_HOME/.config/git-identity/profiles.json"
          jq -e '.profiles["client-acme"].login == "someone-else"' "$r" >/dev/null \
            || fail "the merge dropped a profile this repository does not own"
          jq -e '.profiles.private.ghConfigDir == $p' \
            --arg p "$FAKE_HOME/.config/gh-private" "$r" >/dev/null \
            || fail "the private profile does not point at this machine's gh config dir"
          jq -e '.profiles.private.gitConfig == $p' \
            --arg p "$FAKE_HOME/.config/git-identity/private.gitconfig" "$r" >/dev/null \
            || fail "the private profile does not point at this machine's gitconfig"

      # A modify_ script runs on every apply and rewrites the file each time. If it
      # is not byte-stable, chezmoi reports a change forever and `chezmoi diff`
      # stops being a usable review tool.
      - name: Assert a second apply changes nothing
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          before="$(shasum -a 256 <"$FAKE_HOME/.claude/settings.json")"
          rbefore="$(shasum -a 256 <"$FAKE_HOME/.config/git-identity/profiles.json")"
          env HOME="$FAKE_HOME" chezmoi apply --exclude=scripts --no-tty
          after="$(shasum -a 256 <"$FAKE_HOME/.claude/settings.json")"
          rafter="$(shasum -a 256 <"$FAKE_HOME/.config/git-identity/profiles.json")"
          [ "$before" = "$after" ] || fail "the settings.json merge is not byte-stable"
          [ "$rbefore" = "$rafter" ] || fail "the profiles.json merge is not byte-stable"

          out="$(env HOME="$FAKE_HOME" chezmoi diff --exclude=scripts --no-tty)"
          [ -z "$out" ] || { echo "$out" | head -40; fail "a second apply still has work to do"; }

      - name: Assert the profile split diverges
        run: |
          set -euo pipefail
          brewfile="$(env HOME="$FAKE_HOME" chezmoi execute-template \
            <home/.chezmoiscripts/run_onchange_10-brew.sh.tmpl)"

          echo "$brewfile" | grep -q 'brew "chezmoi"' \
            || { echo "::error::chezmoi missing from the rendered Brewfile"; exit 1; }
          echo "$brewfile" | grep -q 'brew "shellcheck"' \
            || { echo "::error::shellcheck missing from the rendered Brewfile"; exit 1; }

          if [ "${{ matrix.profile }}" = managed ]; then
            echo "$brewfile" | grep -q 'cask_args appdir:' \
              || { echo "::error::managed must pin casks to ~/Applications"; exit 1; }
          else
            echo "$brewfile" | grep -q 'cask_args appdir:' \
              && { echo "::error::owned must not override appdir"; exit 1; }
          fi
          exit 0

      # The git email is the second of the two real divergences and was the only
      # one nothing checked. Compared against the other profile rather than against
      # a literal, so the addresses stay declared in exactly one place.
      - name: Assert the git identity switches on the profile
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          if [ "${{ matrix.profile }}" = managed ]; then other=owned; else other=managed; fi
          otherhome="$(mktemp -d)"
          env HOME="$otherhome" chezmoi init --source . \
            --promptChoice "Machine profile=$other" --no-tty

          mine="$(grep -E '^[[:space:]]*email' "$FAKE_HOME/.gitconfig")"
          theirs="$(env HOME="$otherhome" chezmoi execute-template \
            <home/dot_gitconfig.tmpl | grep -E '^[[:space:]]*email')"

          [ -n "$mine" ] || fail "no git email was rendered for ${{ matrix.profile }}"
          [ "$mine" != "$theirs" ] \
            || fail "both profiles render the same git email, so the split does nothing"

      # GIT_CONFIG_GLOBAL replaces the global config rather than layering onto it,
      # so private.gitconfig's [include] line is load-bearing: drop it and every
      # setting except the identity disappears in any project bound to the profile,
      # while the identity - the one thing anybody checks - still reads correctly.
      - name: Assert the private profile overrides the identity and keeps the rest
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          g="$FAKE_HOME/.config/git-identity/private.gitconfig"

          # -u GIT_CONFIG_GLOBAL is not belt and braces. Anyone running this gate
          # by hand inside a project bound with /git-identity:use has that variable
          # exported into the session, and it outranks HOME: the unset read would
          # return the profile's address, match the other one, and report a broken
          # override on a working tree.
          email="$(env HOME="$FAKE_HOME" GIT_CONFIG_GLOBAL="$g" \
            git config --global --includes --get user.email)"
          machine="$(env -u GIT_CONFIG_GLOBAL HOME="$FAKE_HOME" \
            git config --global --includes --get user.email)"
          crlf="$(env HOME="$FAKE_HOME" GIT_CONFIG_GLOBAL="$g" \
            git config --global --includes --get core.autocrlf)"

          [ "$crlf" = input ] \
            || fail "the [include] does not resolve; the rest of the global config is gone"

          if [ "${{ matrix.profile }}" = managed ]; then
            [ "$email" != "$machine" ] \
              || fail "the private profile did not override the work address"
          else
            [ "$email" = "$machine" ] \
              || fail "on owned the machine default is already the private address"
          fi

  skills:
    name: skill restore
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install chezmoi
        run: brew install chezmoi

      # The restore script is profile-independent, so it runs once rather than per
      # matrix leg. Executing it, rather than grepping its rendered text, is the
      # only way to cover the clone cache, the copy, the symlinks and the names.
      - name: Restore the skill set for real
        run: |
          set -euo pipefail
          fake="$(mktemp -d)"
          env HOME="$fake" chezmoi init --source . \
            --promptChoice "Machine profile=managed" --no-tty
          env HOME="$fake" chezmoi execute-template \
            <home/.chezmoiscripts/run_onchange_after_50-claude-skills.sh.tmpl >"$fake/restore.sh"
          env HOME="$fake" bash "$fake/restore.sh"
          echo "FAKE_HOME=$fake" >>"$GITHUB_ENV"

      - name: Assert the skills landed under the names they have today
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          count="$(find "$FAKE_HOME/.agents/skills" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          [ "$count" -eq 13 ] || fail "expected 13 restored skills, found $count"

          for d in "$FAKE_HOME"/.agents/skills/*/; do
            [ -f "$d/SKILL.md" ] || fail "$(basename "$d") has no SKILL.md"
          done

          for l in "$FAKE_HOME"/.claude/skills/*; do
            [ -L "$l" ] || fail "$(basename "$l") is not a symlink"
            [ -e "$l" ] || fail "$(basename "$l") is a symlink to nothing"
          done

          # The lock key slugifies to writing-hookify-rules; the upstream path says
          # writing-rules. Twelve of thirteen agree, which is why this one needs
          # naming explicitly.
          [ -d "$FAKE_HOME/.agents/skills/writing-hookify-rules" ] \
            || fail "writing-hookify-rules was renamed by the restore"

          # settings.json registers the marketplace at this path; without the clone
          # every bdk plugin fails to load with an error that does not name it.
          [ -d "$FAKE_HOME/projects/bdk/.git" ] || fail "the bdk marketplace was not cloned"

  packages:
    name: package names resolve
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install chezmoi
        run: brew install chezmoi

      # A typo in packages.yaml renders, shellchecks and applies perfectly, then
      # fails halfway through `brew bundle` on a real machine. Checking the names
      # against their registries costs seconds and installs nothing.
      #
      # The names come from the same data the install scripts read, so this adds no
      # second place for a package name to live.
      - name: Every declared package exists in its channel
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          fake="$(mktemp -d)"
          env HOME="$fake" chezmoi init --source . \
            --promptChoice "Machine profile=managed" --no-tty

          names() { env HOME="$fake" chezmoi execute-template; }

          formulae="$(printf '%s' '{{ range .packages.homebrew.formulae }}{{ . }} {{ end }}' | names)"
          casks="$(printf '%s' '{{ range .packages.homebrew.casks.user_level }}{{ . }} {{ end }}{{ range .packages.homebrew.casks.app_bundle }}{{ . }} {{ end }}' | names)"
          npms="$(printf '%s' '{{ range .packages.npm }}{{ . }} {{ end }}' | names)"
          uvs="$(printf '%s' '{{ range .packages.uv }}{{ . }} {{ end }}' | names)"

          echo "formulae: $formulae"
          echo "casks:    $casks"
          echo "npm:      $npms"
          echo "uv:       $uvs"

          [ -n "$formulae" ] || fail "no formulae were rendered; the data path is broken"

          # shellcheck disable=SC2086  # deliberate word splitting into one call
          brew info --json=v2 $formulae >/dev/null || fail "an unknown Homebrew formula is declared"
          # shellcheck disable=SC2086
          brew info --json=v2 --cask $casks >/dev/null || fail "an unknown Homebrew cask is declared"

          for p in $npms; do
            npm view "$p" version >/dev/null 2>&1 || fail "npm package $p does not exist"
          done
          for p in $uvs; do
            curl -fsS "https://pypi.org/pypi/$p/json" -o /dev/null \
              || fail "PyPI package $p does not exist"
          done
